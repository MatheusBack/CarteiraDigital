name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MIN_LINE_COVERAGE: 90
  COVERAGE_ARGS: --coverage --coverage-output-format cobertura

jobs:
  build-and-test:
    name: Build, formatação e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar pacotes e ferramentas
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build (avisos são erros)
        run: dotnet build --no-restore -c Release

      - name: Verificar formatação
        run: dotnet format --verify-no-changes --no-restore

      - name: Testes unitários (domínio)
        run: >
          dotnet test --no-build -c Release --project tests/Wallet.Domain.Tests --
          $COVERAGE_ARGS --coverage-output domain.cobertura.xml

      # Postgres real em container (Testcontainers) + antifraude simulado (WireMock).
      - name: Testes de integração (API + Postgres)
        run: >
          dotnet test --no-build -c Release --project tests/Wallet.Integration.Tests --
          $COVERAGE_ARGS --coverage-output integration.cobertura.xml

      - name: Relatório de cobertura (unitários + integração)
        run: >
          dotnet reportgenerator
          -reports:"**/TestResults/*.cobertura.xml"
          -targetdir:coverage
          -reporttypes:"Cobertura;MarkdownSummaryGithub"
          -filefilters:"-**/Migrations/**"
          -assemblyfilters:"-*.Tests"

      - name: Cobertura mínima
        run: |
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          RATE=$(grep -m1 -oE 'line-rate="[0-9.]+"' coverage/Cobertura.xml | grep -oE '[0-9.]+')
          PERCENT=$(awk "BEGIN { printf \"%.1f\", $RATE * 100 }")
          echo "Cobertura de linhas: ${PERCENT}% (mínimo ${MIN_LINE_COVERAGE}%)"
          awk "BEGIN { exit !($PERCENT >= $MIN_LINE_COVERAGE) }" || {
            echo "::error::Cobertura ${PERCENT}% abaixo do mínimo de ${MIN_LINE_COVERAGE}%"
            exit 1
          }

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**
            coverage/
          if-no-files-found: ignore
