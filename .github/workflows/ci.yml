name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MIN_LINE_COVERAGE: 90

jobs:
  build-and-test:
    name: Build, formatação e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Build (avisos são erros)
        run: dotnet build --no-restore -c Release

      - name: Verificar formatação
        run: dotnet format --verify-no-changes --no-restore

      - name: Testes com cobertura
        run: >
          dotnet test --no-build -c Release --
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Cobertura mínima
        run: |
          REPORT=$(find . -name coverage.cobertura.xml -not -path "*/obj/*" | head -1)
          RATE=$(grep -m1 -oE 'line-rate="[0-9.]+"' "$REPORT" | grep -oE '[0-9.]+')
          PERCENT=$(awk "BEGIN { printf \"%.1f\", $RATE * 100 }")
          echo "### Cobertura de linhas: ${PERCENT}% (mínimo ${MIN_LINE_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          awk "BEGIN { exit !($PERCENT >= $MIN_LINE_COVERAGE) }" || {
            echo "::error::Cobertura ${PERCENT}% abaixo do mínimo de ${MIN_LINE_COVERAGE}%"
            exit 1
          }

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore
